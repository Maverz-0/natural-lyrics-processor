services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: natural-lyrics-processor
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    volumes:
      # Volumen para persistir los modelos descargados de Hugging Face entre reinicios
      - hf_cache:/app/backend/.hf_cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/ping')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  hf_cache:
    name: nlp_hf_cache
